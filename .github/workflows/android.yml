name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: Run deterministic tests on a GitHub-hosted Android emulator
        type: boolean
        default: false
      sign_release:
        description: Sign release on main only after successful Android E2E tests
        type: boolean
        default: false
      android_version_code:
        description: Confirmed Play versionCode (required only for release packaging)
        type: string
        default: ''
      release_version:
        description: Confirmed release version major.minor[.patch]
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release workflow safety
        run: python3 -B scripts/check-release-workflow.py

      - name: Check prerelease packaging configuration
        run: python3 -B scripts/check-prerelease.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check store publishers without credentials or API calls
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==46.0.3
          python3 -B scripts/test-publish-google-play.py
          python3 -B scripts/test-publish-rustore.py
          python3 -B scripts/test-submit-ios-review.py
          python3 -B scripts/check-ios-release-workflow.py
          python3 -B scripts/test-ios-audio-decoder-def.py

      - name: Check iOS scene manifest and simulator matrix logic
        run: |
          python3 -B scripts/test-ios-scene-manifest.py
          python3 -B scripts/test-ios-simulator-matrix-unit.py
          python3 -B scripts/test-ios-verification-pipeline-unit.py

      - name: Explain blocked signing request
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release && !inputs.run_e2e_tests
        run: echo 'Release signing BLOCKED — run_e2e_tests must also be enabled; no signed release will be produced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android build cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: ${{ runner.os }}-android-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint, all unit variants, and release privacy checks
        run: ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:testReleaseUnitTest :app:lint :shared:lint :app:verifyReleaseSafety :app:verifyUiSelectors

      - name: Check both UI translations
        run: python3 -B shared/src/commonTest/check_localization.py

      - name: Assemble app and androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :shared:assembleDebugAndroidTest

      - name: Prepare artifacts for upload
        run: |
          mkdir -p artifacts/debug artifacts/androidTest/debug artifacts/shared
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/androidTest/debug/
          cp shared/build/outputs/apk/androidTest/debug/shared-debug-androidTest.apk artifacts/shared/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts

  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_e2e_tests)) && needs['build'].result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM on the disposable GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # This is a 4 KB runtime smoke, not proof of 16 KB runtime compatibility.
      # Unscripted exploration must not submit signup/OTP to production Identity.
      - name: Run deterministic startup, message layout and isolated migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          # Fold into one shell so the EXIT trap runs before the action stops the emulator.
          script: >-
            trap 'status=$?; trap - EXIT;
            if adb shell test -d /sdcard/Android/data/su.linka.pictures.development/files/message-row-layout/; then
            mkdir -p artifacts/e2e && adb pull /sdcard/Android/data/su.linka.pictures.development/files/message-row-layout/ artifacts/e2e/;
            capture_status=$?; if [ "$status" -eq 0 ]; then status=$capture_status; fi;
            fi; exit "$status"' EXIT;
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=su.linka.pictures.activity.DevelopmentStartupTest,su.linka.pictures.activity.MessageRowLayoutTest -Pandroid.testInstrumentationRunnerArguments.expected_page_size=4096 &&
            ./gradlew :shared:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=su.linka.pictures.bootstrap.AndroidLibraryAdmissionTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-reports
          path: |
            artifacts/e2e/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            shared/build/reports/androidTests/
            shared/build/outputs/androidTest-results/

  bundle-release:
    runs-on: ubuntu-latest
    needs: [build, android-e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release && inputs.run_e2e_tests && github.ref == 'refs/heads/main' && needs['build'].result == 'success' && needs['android-e2e'].result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android build cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: ${{ runner.os }}-android-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate confirmed release metadata before signing setup
        run: ./gradlew :app:verifyReleaseMetadata
        env:
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Decode keystore
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/ci-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Verify privacy gate and build signed release bundle
        run: ./gradlew :app:verifyReleaseSigning :app:verifyReleaseSafety :app:bundleRelease
        env:
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          ANDROID_KEYSTORE_PATH: ${{ format('{0}/ci-release.jks', github.workspace) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release bundle cryptographic signature
        run: python3 -B scripts/check-prerelease.py --aab app/build/outputs/bundle/release/app-release.aab

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Clean up keystore
        if: always()
        run: rm -f -- "${GITHUB_WORKSPACE}/ci-release.jks"
