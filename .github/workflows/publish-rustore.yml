name: Publish Google-signed Android APK to RuStore

on:
  workflow_dispatch:
    inputs:
      google_publish_run_id:
        description: Successful main publish-android run at current main SHA
        required: true
        type: string
      mode:
        description: Inspect only, or upload once into an explicitly prepared empty draft
        type: choice
        required: true
        default: inspect
        options: [inspect, publish-draft]
      draft_id:
        description: Explicit empty RuStore draft ID (publish-draft only)
        type: string
        required: false
      inspection_run_id:
        description: Successful inspect run at this exact delivery commit (publish-draft only)
        type: string
        required: false
      replace_template:
        description: Authorized single replacement of unpublished 2064943286 using empty clone 2064951505
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-su.linka.pictures-rustore
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/rustore-draft-delivery-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_RUN_ID: ${{ inputs.google_publish_run_id }}
      SOURCE_SHA: 1fec1cdeb842f170eddfa08436a595941b2be29a
      DELIVERY_MODE: ${{ inputs.mode }}
      DRAFT_ID: ${{ inputs.draft_id }}
      REPLACE_TEMPLATE: ${{ inputs.replace_template }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RSA protocol dependency
        run: python3 -m pip install cryptography==46.0.3

      - name: Offline safety tests
        run: |
          python3 -B scripts/test-publish-rustore.py
          python3 -B scripts/check-rustore-delivery.py --self-test

      - name: Verify exact successful Google publication source before store credentials
        run: |
          python3 -B scripts/check-rustore-delivery.py
          python3 -B scripts/publish-rustore.py --verify-source-only \
            --google-run-id "$GOOGLE_RUN_ID" --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --evidence rustore-source-evidence.json

      - name: Download only the validated Google publication receipt
        uses: actions/download-artifact@v4
        with:
          name: google-play-publish-evidence-${{ inputs.google_publish_run_id }}
          path: google-receipt
          github-token: ${{ github.token }}
          run-id: ${{ inputs.google_publish_run_id }}

      - name: Validate committed-for-review receipt before store credentials
        run: |
          python3 -B - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('rustore', 'scripts/publish-rustore.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_receipt(json.loads(Path('google-receipt/publish-evidence.json').read_text()), os.environ['SOURCE_SHA'])
          PY

      - name: Validate the prior inspection before allowing draft upload
        if: inputs.mode == 'publish-draft'
        env:
          INSPECTION_RUN_ID: ${{ inputs.inspection_run_id }}
        run: |
          python3 -B - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['INSPECTION_RUN_ID']
          assert re.fullmatch(r'[1-9][0-9]*', run_id)
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], text=True))
          assert run['path'] == '.github/workflows/publish-rustore.yml'
          assert run['head_branch'] == 'fix/rustore-draft-delivery-20261113'
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == repo
          PY

      - name: Download the verified inspection receipt
        if: inputs.mode == 'publish-draft'
        uses: actions/download-artifact@v4
        with:
          name: rustore-publish-evidence-${{ inputs.inspection_run_id }}
          path: inspection
          github-token: ${{ github.token }}
          run-id: ${{ inputs.inspection_run_id }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify Android verification tools (no app build)
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Authenticate Google generated-APK download
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Inspect without mutation, or upload into the explicitly selected empty draft once
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUSTORE_API_KEY_ID: ${{ secrets.RUSTORE_API_KEY_ID }}
          RUSTORE_API_PRIVATE_KEY: ${{ secrets.RUSTORE_API_PRIVATE_KEY }}
        run: |
          args=(--inspect)
          if [ "$DELIVERY_MODE" = publish-draft ]; then
            args=(--publish-draft --draft-id "$DRAFT_ID")
            if [ "$REPLACE_TEMPLATE" = true ]; then
              test "$DRAFT_ID" = 2064951505
              args+=(--replace-template)
            fi
          elif [ "$DELIVERY_MODE" != inspect ]; then
            exit 1
          elif [ "$REPLACE_TEMPLATE" = true ]; then
            exit 1
          elif [ -n "$DRAFT_ID" ]; then
            args+=(--draft-id "$DRAFT_ID")
          fi
          python3 -B scripts/publish-rustore.py "${args[@]}" \
            --google-run-id "$GOOGLE_RUN_ID" --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Preserve credential-free evidence including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustore-publish-evidence-${{ github.run_id }}
          path: |
            rustore-source-evidence.json
            rustore-publish-evidence.json
            google-universal.apk
          if-no-files-found: warn
