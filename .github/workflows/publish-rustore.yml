name: Publish Google-signed Android APK to RuStore

on:
  workflow_dispatch:
    inputs:
      google_publish_run_id:
        description: Successful Google publish run (recovery is pinned to 44898012150)
        required: true
        type: string
      mode:
        description: Inspect/upload empty draft, or reconcile/commit the already accepted pinned upload
        type: choice
        required: true
        default: inspect
        options: [inspect, publish-draft, recover-inspect, recover-commit]
      draft_id:
        description: Explicit authorized RuStore draft ID
        type: string
        required: true
        default: '2064951505'
      inspection_run_id:
        description: Successful matching inspect or recover-inspect run at this delivery commit
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-su.linka.pictures-rustore
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_RUN_ID: ${{ inputs.google_publish_run_id }}
      SOURCE_SHA: ${{ (inputs.mode == 'recover-inspect' || inputs.mode == 'recover-commit') && '184f19f433acc5a81f24bfb2549c7df0756fbdb2' || github.sha }}
      RECOVERY: ${{ inputs.mode == 'recover-inspect' || inputs.mode == 'recover-commit' }}
      DELIVERY_MODE: ${{ inputs.mode }}
      DRAFT_ID: ${{ inputs.draft_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RSA protocol dependency
        run: python3 -m pip install cryptography==46.0.3

      - name: Offline safety tests
        run: |
          python3 -B scripts/test-publish-rustore.py
          python3 -B scripts/check-android-launcher.py
          python3 -B scripts/test-check-android-launcher.py

      - name: Verify exact successful Google publication source before store credentials
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DRAFT_ID" = 2064951505
          args=()
          if [ "$RECOVERY" = true ]; then args=(--recovery); fi
          python3 -B scripts/publish-rustore.py --verify-source-only \
            "${args[@]}" \
            --google-run-id "$GOOGLE_RUN_ID" --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --evidence rustore-source-evidence.json

      - name: Download only the validated Google publication receipt
        uses: actions/download-artifact@v4
        with:
          name: google-play-publish-evidence-${{ inputs.google_publish_run_id }}
          path: google-receipt
          github-token: ${{ github.token }}
          run-id: ${{ inputs.google_publish_run_id }}

      - name: Validate committed-for-review receipt before store credentials
        run: |
          python3 -B - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('rustore', 'scripts/publish-rustore.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_receipt(json.loads(Path('google-receipt/publish-evidence.json').read_text()), os.environ['SOURCE_SHA'])
          PY

      - name: Validate the prior inspection before allowing draft upload
        if: inputs.mode == 'publish-draft' || inputs.mode == 'recover-commit'
        env:
          INSPECTION_RUN_ID: ${{ inputs.inspection_run_id }}
        run: |
          python3 -B - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['INSPECTION_RUN_ID']
          assert re.fullmatch(r'[1-9][0-9]*', run_id)
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'], text=True))
          assert run['path'] == '.github/workflows/publish-rustore.yml'
          assert run['head_branch'] == 'main'
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == repo
          PY

      - name: Download the verified inspection receipt
        if: inputs.mode == 'publish-draft' || inputs.mode == 'recover-commit'
        uses: actions/download-artifact@v4
        with:
          name: rustore-publish-evidence-${{ inputs.inspection_run_id }}
          path: inspection
          github-token: ${{ github.token }}
          run-id: ${{ inputs.inspection_run_id }}

      - name: Download only the pinned original single-upload evidence
        if: inputs.mode == 'recover-inspect' || inputs.mode == 'recover-commit'
        uses: actions/download-artifact@v4
        with:
          name: rustore-publish-evidence-44899101916
          path: failed-upload
          github-token: ${{ github.token }}
          run-id: '44899101916'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Verify Android verification tools (no app build)
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 -B scripts/check-android-launcher.py

      - name: Authenticate Google generated-APK download
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Inspect, upload an empty draft, or recover only the existing upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RUSTORE_API_KEY_ID: ${{ secrets.RUSTORE_API_KEY_ID }}
          RUSTORE_API_PRIVATE_KEY: ${{ secrets.RUSTORE_API_PRIVATE_KEY }}
        run: |
          args=(--inspect --draft-id "$DRAFT_ID")
          if [ "$DELIVERY_MODE" = recover-inspect ]; then
            args=(--recovery --inspect --draft-id "$DRAFT_ID")
          elif [ "$DELIVERY_MODE" = recover-commit ]; then
            args=(--recovery --publish-draft --draft-id "$DRAFT_ID")
          elif [ "$DELIVERY_MODE" = publish-draft ]; then
            args=(--publish-draft --draft-id "$DRAFT_ID")
          elif [ "$DELIVERY_MODE" != inspect ]; then
            exit 1
          fi
          python3 -B scripts/publish-rustore.py "${args[@]}" \
            --google-run-id "$GOOGLE_RUN_ID" --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Preserve credential-free evidence including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustore-publish-evidence-${{ github.run_id }}
          path: |
            rustore-source-evidence.json
            rustore-publish-evidence.json
            google-universal.apk
          if-no-files-found: warn
