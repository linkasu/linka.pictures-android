plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

def envOrProperty = { String key ->
    return System.getenv(key) ?: (project.hasProperty(key) ? project.property(key) : null)
}

File keystoreFile = null
def keystorePathFromEnv = envOrProperty("ANDROID_KEYSTORE_PATH")?.toString()
if (keystorePathFromEnv) {
    keystoreFile = file(keystorePathFromEnv)
} else {
    def defaultFile = rootProject.file("main.jks")
    if (defaultFile.exists()) {
        keystoreFile = defaultFile
    }
}

def keystorePassword = envOrProperty("ANDROID_KEYSTORE_PASSWORD")?.toString()
def keyAliasValue = envOrProperty("ANDROID_KEY_ALIAS")?.toString() ?: "key0"
def keyPasswordValue = envOrProperty("ANDROID_KEY_PASSWORD")?.toString() ?: keystorePassword
def hasReleaseSigningConfig = keystoreFile?.exists() && keystorePassword && keyAliasValue && keyPasswordValue

android {
    namespace 'su.linka.pictures'
    compileSdk 35

    defaultConfig {
        applicationId "su.linka.pictures"
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "TELEMETRY_COLLECTION_ALLOWED", "false"
        }
        release {
            buildConfigField "boolean", "TELEMETRY_COLLECTION_ALLOWED", "true"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "com.github.permissions-dispatcher:permissionsdispatcher:4.9.2"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-analytics'
    annotationProcessor "com.github.permissions-dispatcher:permissionsdispatcher-processor:4.9.2"
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation project(':shared')

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
}

tasks.register('verifyReleasePrivacy') {
    dependsOn 'generateReleaseBuildConfig', 'processReleaseManifest'

    doLast {
        def crashlyticsComponents = configurations.releaseRuntimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .findAll { component -> component.id.displayName.toLowerCase().contains('crashlytics') }
        if (!crashlyticsComponents.isEmpty()) {
            throw new GradleException("Crashlytics must not be present in releaseRuntimeClasspath: ${crashlyticsComponents}")
        }

        def manifestFiles = fileTree("${layout.buildDirectory.get()}/intermediates/merged_manifests/release") {
            include '**/AndroidManifest.xml'
        }.files
        if (manifestFiles.size() != 1) {
            throw new GradleException("Expected one merged release manifest, found ${manifestFiles.size()}")
        }
        def manifestText = manifestFiles.first().getText('UTF-8')
        if (manifestText.toLowerCase().contains('crashlytics')) {
            throw new GradleException('Merged release manifest must not contain Crashlytics components or metadata')
        }
        if (!manifestText.contains('android:name="su.linka.pictures.LinkaPicturesApp"')) {
            throw new GradleException('Release manifest must initialize Telemetry from LinkaPicturesApp')
        }
        if (!(manifestText =~ /(?s)firebase_analytics_collection_enabled.*?android:value="false"/)) {
            throw new GradleException('Firebase Analytics must default to disabled in the release manifest')
        }

        def buildConfigFiles = fileTree("${layout.buildDirectory.get()}/generated/source/buildConfig/release") {
            include '**/BuildConfig.java'
        }.files
        if (buildConfigFiles.size() != 1 ||
            !buildConfigFiles.first().getText('UTF-8').contains('TELEMETRY_COLLECTION_ALLOWED = true')) {
            throw new GradleException('Release BuildConfig must allow consent-controlled Analytics collection')
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyReleasePrivacy'
}
