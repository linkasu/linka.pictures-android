plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def envOrProperty = { String key ->
    return System.getenv(key) ?: (project.hasProperty(key) ? project.property(key) : null)
}

File keystoreFile = null
def keystorePathFromEnv = envOrProperty("ANDROID_KEYSTORE_PATH")?.toString()
if (keystorePathFromEnv) {
    keystoreFile = file(keystorePathFromEnv)
} else {
    def defaultFile = rootProject.file("main.jks")
    if (defaultFile.exists()) {
        keystoreFile = defaultFile
    }
}

def keystorePassword = envOrProperty("ANDROID_KEYSTORE_PASSWORD")?.toString()
def keyAliasValue = envOrProperty("ANDROID_KEY_ALIAS")?.toString() ?: "key0"
def keyPasswordValue = envOrProperty("ANDROID_KEY_PASSWORD")?.toString() ?: keystorePassword
def hasReleaseSigningConfig = keystoreFile?.exists() && keystorePassword && keyAliasValue && keyPasswordValue

android {
    namespace 'su.linka.pictures'
    compileSdk 36

    defaultConfig {
        applicationId "su.linka.pictures"
        minSdk 21
        targetSdk 36
        // Historical defaults are for local checks only; packaging requires explicit release metadata.
        versionCode = (envOrProperty('ANDROID_VERSION_CODE') ?: '5').toString().toInteger()
        versionName = (envOrProperty('RELEASE_VERSION') ?: '1.4').toString()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.development'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

def verifyReleaseMetadata = tasks.register('verifyReleaseMetadata') {
    doLast {
        def code = envOrProperty('ANDROID_VERSION_CODE')?.toString()
        def version = envOrProperty('RELEASE_VERSION')?.toString()
        if (!code || !(code ==~ /[1-9][0-9]*/) || code.toBigInteger() > 2100000000 ||
            !version || !(version ==~ /[0-9]+\.[0-9]+(\.[0-9]+)?/)) {
            throw new GradleException('Packaging requires ANDROID_VERSION_CODE (1..2100000000) and RELEASE_VERSION (major.minor[.patch]); confirm store metadata first')
        }
    }
}
tasks.register('verifyReleaseSigning') {
    dependsOn verifyReleaseMetadata
    doLast {
        if (!hasReleaseSigningConfig) {
            throw new GradleException('Signed release requires a complete release signing configuration')
        }
    }
}
tasks.configureEach {
    if (name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle']) {
        dependsOn verifyReleaseMetadata
    }
}

dependencies {
    implementation 'androidx.compose.ui:ui:1.9.4'

    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation project(':shared')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
}

tasks.register('verifyReleaseSafety') {
    dependsOn 'processDebugManifest', 'processReleaseManifest'
    doLast {
        ['debug', 'release'].each { variant ->
            def forbidden = configurations.getByName("${variant}RuntimeClasspath").incoming.resolutionResult.allComponents.findAll {
                it.id.displayName.toLowerCase().contains('firebase') || it.id.displayName.toLowerCase().contains('zip4j')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Forbidden runtime dependencies in ${variant}: ${forbidden}")
            def manifests = fileTree("${layout.buildDirectory.get()}/intermediates/merged_manifests/${variant}") { include '**/AndroidManifest.xml' }.files
            if (manifests.size() != 1) throw new GradleException("Expected one ${variant} manifest")
            def text = manifests.first().getText('UTF-8')
            if (text.toLowerCase().contains('firebase') || text.toLowerCase().contains('crashlytics')) throw new GradleException('Third-party telemetry SDK must not be packaged')
            if (!text.contains('android:name="su.linka.pictures.activity.MainActivity"')) throw new GradleException('Shared product launcher is missing')
            ['GridActivity', 'SetEditActivity', 'SettingsActivity'].each { name ->
                if (text.contains("su.linka.pictures.activity.${name}")) throw new GradleException("Legacy activity remains: ${name}")
            }
            if (variant == 'release' && text.contains('parity-fixtures')) throw new GradleException('Test provider leaked into release')
            if (!text.contains('android.permission.INTERNET')) throw new GradleException('Identity HTTPS permission is missing')
            if (text.contains('android:usesCleartextTraffic="true"')) throw new GradleException('Cleartext transport is forbidden')
            ['ACCESS_NETWORK_STATE', 'POST_NOTIFICATIONS', 'WAKE_LOCK'].each { permission ->
                if (text.contains("android.permission.${permission}")) throw new GradleException("Unused permission remains: ${permission}")
            }
        }
    }
}

tasks.register('verifyUiSelectors', JavaExec) {
    dependsOn 'compileDebugAndroidTestKotlin'
    workingDir rootProject.projectDir
    mainClass = 'su.linka.pictures.activity.UiTextCheckKt'
    classpath files(tasks.named('compileDebugAndroidTestKotlin').flatMap { it.destinationDirectory })
    classpath configurations.debugAndroidTestRuntimeClasspath.filter { it.name.endsWith('.jar') }
}

tasks.named('check').configure {
    dependsOn 'verifyReleaseSafety', 'verifyUiSelectors'
}
